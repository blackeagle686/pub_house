{% extends 'base.html' %}
{% block title %}تم الطلب بنجاح - دار الأديب{% endblock %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-sm rounded-4 p-5">
                <div class="mx-auto bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center mb-4" style="width: 100px; height: 100px;">
                    <i class="fas fa-check fa-3x"></i>
                </div>
                <h2 class="fw-bold mb-3">تم استلام طلبك بنجاح!</h2>
                <p class="text-muted fs-5 mb-4">شكراً لتسوقك من دار الأديب. جاري تجهيز طلبك وسنقوم بالتواصل معك قريباً.</p>
                
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'accounts:profile' %}" class="btn btn-primary rounded-pill px-4">متابعة الطلب</a>
                    <a href="/" class="btn btn-outline-dark rounded-pill px-4">العودة للرئيسية</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
