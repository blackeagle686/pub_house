<style>
    .sidebar a, .sidebar form button { position: relative; overflow: visible; }
    
    /* Tooltip Body */
    .sidebar.collapsed a::after, .sidebar.collapsed form button::after {
        content: attr(data-title);
        position: absolute;
        right: 100%; /* RTL: left of the sidebar */
        top: 50%;
        transform: translateY(-50%) translateX(20px);
        background-color: var(--primary-color, #f8aa27);
        color: #121212;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: bold;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        z-index: 1050;
        margin-right: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        visibility: hidden;
    }
    
    /* Tooltip Arrow */
    .sidebar.collapsed a::before, .sidebar.collapsed form button::before {
        content: '';
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translateY(-50%) translateX(20px);
        border: 6px solid transparent;
        border-left-color: var(--primary-color, #f8aa27);
        opacity: 0;
        pointer-events: none;
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        margin-right: -2px;
        z-index: 1050;
        visibility: hidden;
    }
    
    /* Hover Animation */
    .sidebar.collapsed a:hover::after, .sidebar.collapsed form button:hover::after,
    .sidebar.collapsed a:hover::before, .sidebar.collapsed form button:hover::before {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(0);
    }
    
    /* Ensure icon hover also triggers */
    .sidebar.collapsed a:hover i, .sidebar.collapsed form button:hover i {
        transform: scale(1.1);
        transition: all 0.3s ease;
    }
    /* Custom Scrollbar for Sidebar */
    .sidebar-links-container::-webkit-scrollbar { width: 5px; }
    .sidebar-links-container::-webkit-scrollbar-track { background: transparent; }
    .sidebar-links-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    .sidebar-links-container::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
</style>
