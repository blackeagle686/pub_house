{% extends 'dashboard/base_dashboard.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-5">
        <div class="card border-0 shadow-sm rounded-4 p-5">
            <i class="fas fa-exclamation-triangle fa-5x text-danger mb-4"></i>
            <h3 class="fw-bold mb-3">تأكيد الحذف</h3>
            <p class="text-muted fs-5 mb-4">هل أنت متأكد من رغبتك في حذف هذا العنصر؟ لا يمكن التراجع عن هذا الإجراء.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <button type="submit" class="btn btn-danger rounded-pill px-5 btn-lg">نعم، احذف</button>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-5 btn-lg">إلغاء</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
