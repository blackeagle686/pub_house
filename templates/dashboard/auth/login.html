<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - لوحة تحكم دار الأديب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background-color: var(--bg-cream); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: none; max-width: 900px; width: 100%; background: #fff; }
        .login-image { background: url('/static/images/hero3.png') center/cover no-repeat; min-height: 500px; position: relative; }
        .login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(248, 170, 39, 0.8), rgba(17, 17, 17, 0.9)); }
        .form-control { border-radius: 50rem; padding: 0.75rem 1.5rem; background-color: #f8f9fa; border: 1px solid #e9ecef; }
        .form-control:focus { box-shadow: none; border-color: var(--primary-color); background-color: #fff; }
        .btn-login { border-radius: 50rem; padding: 0.75rem; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container p-3 p-md-0">
        <div class="row g-0 login-card mx-auto">
            <!-- Left Side Image (Visible on Desktop) -->
            <div class="col-md-5 d-none d-md-block login-image">
                <div class="login-overlay d-flex flex-column justify-content-center align-items-center text-center p-4">
                    <img src="/static/images/hero1.png" alt="شعار دار الأديب" style="max-width: 150px; filter: brightness(0) invert(1);" class="mb-4">
                    <h2 class="text-white fw-bold mb-3">لوحة تحكم دار الأديب</h2>
                    <p class="text-white-50">إدارة متكاملة للمبيعات، المخطوطات، الكُتّاب والعملاء بكل سهولة واحترافية.</p>
                </div>
            </div>
            
            <!-- Right Side Form -->
            <div class="col-md-7 p-5 d-flex flex-column justify-content-center">
                <div class="text-center mb-4 d-md-none">
                    <img src="/static/images/hero1.png" alt="شعار دار الأديب" style="max-width: 120px;" class="mb-3">
                </div>
                <h3 class="fw-bold mb-1" style="color: var(--text-dark);">مرحباً بك مجدداً 👋</h3>
                <p class="text-muted mb-4">قم بتسجيل الدخول للوصول إلى لوحة الإدارة.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {% if form.errors %}
                    <div class="alert alert-danger rounded-4 text-sm p-3">
                        بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.
                    </div>
                    {% endif %}
                    
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold ms-2">اسم المستخدم أو البريد الإلكتروني</label>
                        <div class="input-group">
                            <input type="text" name="username" class="form-control ps-4" placeholder="أدخل اسم المستخدم" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold ms-2">كلمة المرور</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control ps-4" placeholder="أدخل كلمة المرور" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4 px-2">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">تذكرني</label>
                        </div>
                        <a href="#" class="text-decoration-none small" style="color: var(--primary-color);">نسيت كلمة المرور؟</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-login shadow-sm">تسجيل الدخول</button>
                    <a href="/" class="btn btn-outline-dark w-100 btn-login mt-3"><i class="fas fa-arrow-right me-2"></i> العودة للموقع</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
